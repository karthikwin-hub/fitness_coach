# Production PostgreSQL on the Oracle VM (localhost only — not exposed publicly).
#
# Usage on VM:
#   cd /opt/fitness-coach
#   cp deploy/env.production.example web/.env.local   # edit POSTGRES_PASSWORD + DATABASE_URL
#   export $(grep -v '^#' web/.env.local | xargs)    # or use docker compose --env-file
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# DATABASE_URL in web/.env.local:
#   postgresql://fitness:<POSTGRES_PASSWORD>@127.0.0.1:5432/fitness_coach

services:
  postgres:
    image: postgres:16-alpine
    container_name: fitness-coach-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in env}
      POSTGRES_DB: fitness_coach
    volumes:
      - /opt/fitness-coach/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness_coach"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
